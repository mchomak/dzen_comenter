<svg xmlns="http://www.w3.org/2000/svg" width="1530" height="1070" viewBox="0 0 1530 1070" role="img" aria-labelledby="title desc">
<title id="title">Как работает бот Дзена — карта одного цикла</title>
<desc id="desc">Пять колонок показывают вход, чтение Студии, генерацию, отправку и исходы. Стрелки подписывают условия и переходы.</desc>
<defs>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#416351" stroke-opacity=".12"/></pattern>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4 0 8Z" fill="context-stroke"/></marker>
</defs>
<style>
