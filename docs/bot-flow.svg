  .edge{fill:none;stroke-width:1.8;marker-end:url(#arrow);stroke-linejoin:round}
  .label{font-size:12px;font-weight:650;text-anchor:middle;paint-order:stroke;stroke:#f4f8f5;stroke-width:5px;stroke-linejoin:round}
  .node{stroke-width:1.4}
  .name{font-size:14px;font-weight:650;text-anchor:middle}
  .detail{font-size:12px;text-anchor:middle}
  .caption{font-size:15px;font-weight:700}
  .legend{font-size:13px}
</style>
