<text x="755" y="1009" class="label">После завершения цикла — следующий опрос</text>
<path d="M43 570 L24 570 L24 925 L43 925" class="edge" stroke="#69508d"/>
<path d="M155 792 L155 888" class="edge" stroke="#69508d"/>
<rect class="node" x="43" y="88" width="224" height="74" rx="22" fill="#d8eee4" stroke="#247156"/>
<text x="155" y="121.0" class="name">Начало цикла</text>
<text x="155" y="136.0" class="detail">Проверить команду входа</text>
<path class="node" d="M43 220l12 -36h200l12 36 -12 36h-200Z" fill="#fffdf6" stroke="#93713c"/>
<text x="155" y="223.5" class="name">Сессия работает?</text>
<rect class="node" x="43" y="293" width="224" height="74" rx="7" fill="#ffffff" stroke="#568374"/>
<text x="155" y="318.5" class="name">Восстановить вход</text>
<text x="155" y="333.5" class="detail">Файл сессии, данные входа,</text>
<text x="155" y="348.5" class="detail">при необходимости Telegram</text>
<path class="node" d="M43 445l12 -36h200l12 36 -12 36h-200Z" fill="#fffdf6" stroke="#93713c"/>
<text x="155" y="448.5" class="name">Вход восстановлен?</text>
<rect class="node" x="43" y="533" width="224" height="74" rx="7" fill="#f6e9df" stroke="#9a6248"/>
<text x="155" y="566.0" class="name">Нужна авторизация</text>
<text x="155" y="581.0" class="detail">Цикл завершается</text>
<rect class="node" x="43" y="718" width="224" height="74" rx="7" fill="#f6e9df" stroke="#9a6248"/>
<text x="155" y="743.5" class="name">Сбой цикла</text>
<text x="155" y="758.5" class="detail">Запись в журнал; ограниченные</text>
<text x="155" y="773.5" class="detail">повторы управляющего цикла</text>
<rect class="node" x="43" y="888" width="224" height="74" rx="22" fill="#d8eee4" stroke="#247156"/>
<text x="155" y="921.0" class="name">Пауза до следующего цикла</text>
<text x="155" y="936.0" class="detail">Интервал POLL_INTERVAL</text>
<rect class="node" x="343" y="88" width="224" height="74" rx="7" fill="#ffffff" stroke="#568374"/>
<text x="455" y="113.5" class="name">Читать ленту Студии</text>
<text x="455" y="128.5" class="detail">Записать ленту в БД, прокрутить,</text>
<text x="455" y="143.5" class="detail">раскрыть ответы и собрать снимок</text>
<path class="node" d="M343 220l12 -36h200l12 36 -12 36h-200Z" fill="#fffdf6" stroke="#93713c"/>
<text x="455" y="223.5" class="name">Лента прочитана?</text>
<rect class="node" x="343" y="293" width="224" height="74" rx="7" fill="#ffffff" stroke="#568374"/>
<text x="455" y="326.0" class="name">Проверить комментарий</text>
<text x="455" y="341.0" class="detail">Имя автора, история, возраст</text>
<path class="node" d="M343 445l12 -36h200l12 36 -12 36h-200Z" fill="#fffdf6" stroke="#93713c"/>
<text x="455" y="448.5" class="name">Комментарий допустим?</text>
<rect class="node" x="343" y="748" width="224" height="74" rx="7" fill="#e5edf9" stroke="#4266a0"/>
<text x="455" y="766.0" class="name">Пропуск</text>
<text x="455" y="781.0" class="detail">Свой автор: без записи.</text>
<text x="455" y="796.0" class="detail">Свой ответ или старый: сохранить</text>
<text x="455" y="811.0" class="detail">и отметить пропуск для нового.</text>
<path class="node" d="M343 560l12 -36h200l12 36 -12 36h-200Z" fill="#fffdf6" stroke="#93713c"/>
<text x="455" y="563.5" class="name">Часовой лимит доступен?</text>
<rect class="node" x="343" y="627" width="224" height="74" rx="7" fill="#e5edf9" stroke="#4266a0"/>
<text x="455" y="652.5" class="name">Сохранить в PostgreSQL</text>
<text x="455" y="667.5" class="detail">Есть лимит: добавить в очередь.</text>
<text x="455" y="682.5" class="detail">Лимит исчерпан: сохранить запись.</text>
<path class="node" d="M343 895l12 -36h200l12 36 -12 36h-200Z" fill="#fffdf6" stroke="#93713c"/>
<text x="455" y="898.5" class="name">Остались комментарии?</text>
<path class="node" d="M643 125l12 -36h200l12 36 -12 36h-200Z" fill="#fffdf6" stroke="#93713c"/>
<text x="755" y="121.0" class="name">Есть задача генерации?</text>
<text x="755" y="136.0" class="detail">При доступном часовом лимите</text>
<path class="node" d="M643 220l12 -36h200l12 36 -12 36h-200Z" fill="#fffdf6" stroke="#93713c"/>
<text x="755" y="216.0" class="name">Можно отвечать?</text>
<text x="755" y="231.0" class="detail">По возрасту и истории</text>
<path class="node" d="M643 330l12 -36h200l12 36 -12 36h-200Z" fill="#fffdf6" stroke="#93713c"/>
<text x="755" y="333.5" class="name">В базе есть текст статьи?</text>
<rect class="node" x="643" y="408" width="224" height="74" rx="7" fill="#ffffff" stroke="#568374"/>
<text x="755" y="433.5" class="name">Открыть и прочитать статью</text>
<text x="755" y="448.5" class="detail">По ссылке в отдельной вкладке.</text>
<text x="755" y="463.5" class="detail">Сохранить результат чтения.</text>
<rect class="node" x="643" y="523" width="224" height="74" rx="7" fill="#ffffff" stroke="#568374"/>
<text x="755" y="548.5" class="name">Запросить ответ у модели</text>
<text x="755" y="563.5" class="detail">Комментарий, ветка, правила,</text>
<text x="755" y="578.5" class="detail">текст статьи при наличии</text>
<path class="node" d="M643 664l12 -36h200l12 36 -12 36h-200Z" fill="#fffdf6" stroke="#93713c"/>
<text x="755" y="660.0" class="name">Получен допустимый ответ?</text>
<text x="755" y="675.0" class="detail">Длинный текст сократить один раз</text>
<rect class="node" x="643" y="748" width="224" height="74" rx="7" fill="#e5edf9" stroke="#4266a0"/>
<text x="755" y="781.0" class="name">Сохранить ответ</text>
<text x="755" y="796.0" class="detail">Создать задачу в очереди отправки</text>
<rect class="node" x="643" y="858" width="224" height="74" rx="7" fill="#f6e9df" stroke="#9a6248"/>
<text x="755" y="883.5" class="name">Пропуск или ошибка</text>
<text x="755" y="898.5" class="detail">SKIP либо ошибка и повторы</text>
<text x="755" y="913.5" class="detail">по настройкам</text>
<path class="node" d="M943 125l12 -36h200l12 36 -12 36h-200Z" fill="#fffdf6" stroke="#93713c"/>
<text x="1055" y="121.0" class="name">Есть задача отправки?</text>
<text x="1055" y="136.0" class="detail">Просроченные задачи закрыть</text>
<path class="node" d="M943 220l12 -36h200l12 36 -12 36h-200Z" fill="#fffdf6" stroke="#93713c"/>
<text x="1055" y="223.5" class="name">Комментарий найден?</text>
<path class="node" d="M943 330l12 -36h200l12 36 -12 36h-200Z" fill="#fffdf6" stroke="#93713c"/>
<text x="1055" y="333.5" class="name">Включена автопубликация?</text>
<path class="node" d="M943 445l12 -36h200l12 36 -12 36h-200Z" fill="#fffdf6" stroke="#93713c"/>
<text x="1055" y="441.0" class="name">Такой ответ уже виден?</text>
<text x="1055" y="456.0" class="detail">Проверка публичной страницы</text>
<rect class="node" x="943" y="523" width="224" height="74" rx="7" fill="#ffffff" stroke="#568374"/>
<text x="1055" y="548.5" class="name">Отправить ответ</text>
<text x="1055" y="563.5" class="detail">Записать отметку перед нажатием</text>
<text x="1055" y="578.5" class="detail">кнопки в Студии</text>
<path class="node" d="M943 664l12 -36h200l12 36 -12 36h-200Z" fill="#fffdf6" stroke="#93713c"/>
<text x="1055" y="667.5" class="name">Публикация подтверждена?</text>
<rect class="node" x="1243" y="88" width="224" height="74" rx="7" fill="#f6e9df" stroke="#9a6248"/>
<text x="1355" y="121.0" class="name">Очередь пуста</text>
<text x="1355" y="136.0" class="detail">Цикл завершён</text>
<rect class="node" x="1243" y="183" width="224" height="74" rx="7" fill="#f6e9df" stroke="#9a6248"/>
<text x="1355" y="208.5" class="name">Ошибка отправки</text>
<text x="1355" y="223.5" class="detail">Повтор с сохранённым текстом</text>
<text x="1355" y="238.5" class="detail">или завершение по лимиту</text>
<rect class="node" x="1243" y="293" width="224" height="74" rx="7" fill="#e5edf9" stroke="#4266a0"/>
<text x="1355" y="318.5" class="name">Черновик</text>
<text x="1355" y="333.5" class="detail">Заполнить поле без отправки,</text>
<text x="1355" y="348.5" class="detail">завершить задачу при успехе</text>
<rect class="node" x="1243" y="468" width="224" height="74" rx="7" fill="#e5edf9" stroke="#4266a0"/>
<text x="1355" y="501.0" class="name">Опубликовано</text>
<text x="1355" y="516.0" class="detail">Записать факт и время публикации</text>
<rect class="node" x="1243" y="627" width="224" height="74" rx="7" fill="#f6e9df" stroke="#9a6248"/>
<text x="1355" y="652.5" class="name">Исход не подтверждён</text>
<text x="1355" y="667.5" class="detail">При неизвестном исходе</text>
<text x="1355" y="682.5" class="detail">автоматической отправки снова нет</text>
<text x="45" y="1042" class="legend">Зелёный — ход цикла   •   Охра — условия и ошибки   •   Синий — запись в базе   •   Фиолетовый — переход к следующей задаче или циклу</text></svg>
