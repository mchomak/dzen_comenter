services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
      HEADLESS: ${HEADLESS:-true}
      RUN_DB_MIGRATIONS: ${RUN_DB_MIGRATIONS:-true}
      BOT_HEALTH_PATH: /app/config/bot_health.json
      USER_DATA_DIR: /app/user_data
      STORAGE_STATE_PATH: /app/session_state/storage_state.json
      GIGACHAT_VERIFY_SSL_CERTS: "true"
      RUNTIME_CONFIG_PATH: /app/config/runtime_config.json
      DZEN_LOGIN_CONTROL_SOCKET: /run/dzen-login-control/dzen-login.sock
    volumes:
      - browser_data:/app/user_data
      - session_state:/app/session_state
      - config_data:/app/config
      - dzen_login_control:/run/dzen-login-control
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "dzen_commenter.bot_health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: []
    command: uvicorn dzen_commenter.admin.app:app --host 0.0.0.0 --port 8080
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
      HEADLESS: ${HEADLESS:-true}
      BOT_HEALTH_PATH: /app/config/bot_health.json
      RUNTIME_CONFIG_PATH: /app/config/runtime_config.json
      DZEN_LOGIN_CONTROL_SOCKET: /run/dzen-login-control/dzen-login.sock
    volumes:
      - config_data:/app/config
      - dzen_login_control:/run/dzen-login-control
      - /run/dzen-vnc-control.sock:/run/dzen-vnc-control.sock
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER must be set} -d ${POSTGRES_DB:?POSTGRES_DB must be set}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  browser_data:
  session_state:
  config_data:
  dzen_login_control:
